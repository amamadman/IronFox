name: Build IronFox arm64

on:
  workflow_dispatch:
    inputs:
      enable_debug:
        description: "Enable SSH debug session (tmate)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Maximize disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get purge -y --auto-remove \
            azure-cli google-cloud-cli microsoft-edge-stable \
            firefox powershell mono-complete libmono* \
            amazon-ecr-credential-helper eb-cli \
            || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Add swap space
        run: |
          if [ -f /swapfile ]; then
            sudo swapoff /swapfile
            sudo rm /swapfile
          fi
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build Docker image
        run: docker build -t ironfox-builder -f Dockerfile .

      - name: Restore or create keystore
        id: keystore
        run: |
          mkdir -p /tmp/ironfox-keys

          if [ -n "${{ secrets.IRONFOX_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from secret..."
            echo '${{ secrets.IRONFOX_KEYSTORE_BASE64 }}' | base64 -d > /tmp/ironfox-keys/ironfox-android-keystore.jks
            echo "new_keystore=false" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret found — generating new one..."
            keytool -genkey -v \
              -keystore /tmp/ironfox-keys/ironfox-android-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias ironfox \
              -dname "CN=Debug,O=Debug,C=US" \
              -storepass ironfox -keypass ironfox
            echo "new_keystore=true" >> "$GITHUB_OUTPUT"
          fi

          KEYSTORE_PASS="${{ secrets.IRONFOX_KEYSTORE_PASS }}"
          KEY_PASS="${{ secrets.IRONFOX_KEY_PASS }}"
          echo -n "${KEYSTORE_PASS:-ironfox}" > /tmp/ironfox-keys/ironfox-android-keystore-pass.txt
          echo -n "${KEY_PASS:-ironfox}" > /tmp/ironfox-keys/ironfox-android-signing-key-pass.txt

          ls -la /tmp/ironfox-keys/

      - name: Upload new keystore for safekeeping
        if: steps.keystore.outputs.new_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: |
            /tmp/ironfox-keys/ironfox-android-keystore.jks
          retention-days: 90

      - name: Create build container
        run: |
          docker run -d --name ironfox-build \
            -v "$GITHUB_WORKSPACE:/app" \
            -v /tmp/ironfox-keys:/opt/IronFox \
            -e IRONFOX_ANDROID_KEYSTORE=/opt/IronFox/ironfox-android-keystore.jks \
            -e IRONFOX_ANDROID_KEYSTORE_KEY_ALIAS=ironfox \
            -e IRONFOX_ANDROID_KEYSTORE_PASS_FILE=/opt/IronFox/ironfox-android-keystore-pass.txt \
            -e IRONFOX_ANDROID_KEYSTORE_KEY_PASS_FILE=/opt/IronFox/ironfox-android-signing-key-pass.txt \
            -e IRONFOX_SIGN_SKIP_ADB=1 \
            ironfox-builder \
            sleep infinity
          docker exec ironfox-build git config --global --add safe.directory /app

      - name: Get sources
        run: docker exec ironfox-build bash -c 'set -euo pipefail; df -h /; bash /app/scripts/get_sources.sh'

      - name: Prebuild
        run: docker exec ironfox-build bash -c 'set -euo pipefail; df -h /; bash /app/scripts/prebuild.sh'

      - name: Build arm64
        run: docker exec ironfox-build bash -c 'set -euo pipefail; df -h /; yes y | bash /app/scripts/build.sh arm64; df -h /' || [ $? -eq 141 ]

      - name: Find APK
        if: always()
        id: find_apk
        run: |
          APK=$(find "$GITHUB_WORKSPACE/build/outputs/apk" -name '*.apk' -type f 2>/dev/null | head -1 || true)
          if [ -n "$APK" ]; then
            echo "apk=$APK" >> "$GITHUB_OUTPUT"
            echo "Found: $APK"
          else
            echo "No APK found"
          fi

      - name: Upload APK
        if: always() && steps.find_apk.outputs.apk
        uses: actions/upload-artifact@v4
        with:
          name: ironfox-arm64-apk
          path: ${{ steps.find_apk.outputs.apk }}
          retention-days: 14

      - name: Create GitHub Release
        if: always() && steps.find_apk.outputs.apk
        run: |
          TAG="v$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "${{ steps.find_apk.outputs.apk }}" \
            --title "IronFoxed arm64 $(date +%Y-%m-%d)" \
            --notes "Automated arm64 build from $(echo $GITHUB_SHA | cut -c1-7)" \
            --target "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug via SSH
        if: always() && inputs.enable_debug
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
